name: Pipeline 4 - Build & Deploy Docusaurus

on:
  repository_dispatch:
    types: [mdx-updated]
  workflow_dispatch: # Manually deploy existing MDX files anytime

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout central-docs-hub
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docusaurus/package-lock.json

      - name: Install Dependencies & Build Isolated Portals
        working-directory: ./docusaurus
        run: |
          npm ci --prefer-offline
          rm -rf build-all
          DOCS_PORTAL=user   npx docusaurus build --out-dir build-all/user
          DOCS_PORTAL=client npx docusaurus build --out-dir build-all/client
          DOCS_PORTAL=admin  npx docusaurus build --out-dir build-all/admin

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docusaurus/build-all

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
